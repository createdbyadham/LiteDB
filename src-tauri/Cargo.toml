[package]
name = "LiteDB"
version = "2.1.0"
description = "LiteDB - A simple and lightweight database viewer/editor for your projects"
authors = ["Adham Ehab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
