name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck (evals)
        run: npm run typecheck:evals

      - name: Typecheck (app)
        run: npm run typecheck:app

      - name: Typecheck (MCP server)
        run: npm run typecheck:mcp

  evals:
    name: Eval harness (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite is unflagged from Node 24 onwards.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # Verifies the harness itself: guard, comparator, fixture isolation and
      # outcome classification, using a stubbed model. Costs nothing, so it
      # runs on every pull request.
      - name: Harness self-test
        run: npm run eval:selftest

      # Executes every reference query in the golden set. Catches a broken
      # case before it can masquerade as a model failure in a scored run.
      - name: Verify golden set
        run: npm run eval:verify

  mcp:
    name: MCP server (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite is unflagged from Node 24 onwards.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      # Asserts the outcome rather than the call: a write must still be
      # sitting in the table after `query` returns its preview. Every piece of
      # the guarantee — classifier, policy floor, token store, read-only
      # connection — can degrade silently, leaving a server that still answers
      # questions correctly and guards nothing.
      - name: Server self-test
        run: npm run mcp:selftest

      # The published artefact is the bundle, not the sources.
      - name: Build the distributable
        run: npm run mcp:build

  rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings
