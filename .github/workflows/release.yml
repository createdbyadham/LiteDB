name: Publish Release

# Pushing v2.4.0 publishes the GitHub release on that same tag.
# The README badge and the changelog link to releases/tag/v<version>.
# Do not set tagName to app-v__VERSION__; that creates a second tag with the
# installers and leaves the linked tag empty.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY          required: the updater checks every download with it
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Optional, all or none per platform; without them the installers are unsigned:
#   APPLE_CERTIFICATE                  base64 .p12 of the Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY             Developer ID Application: Name (TEAMID)
#   Notarization, either:
#     APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#     or APPLE_API_KEY (Key ID), APPLE_API_ISSUER, APPLE_API_PRIVATE_KEY (.p8 contents)
#   SIGNPATH_API_TOKEN
#   SIGNPATH_ORGANIZATION_ID
# Variables (optional):
#   SIGNPATH_PROJECT_SLUG              default litedb
#   SIGNPATH_SIGNING_POLICY            default release-signing (SignPath Foundation)
# The SignPath project's default artifact configuration must Authenticode-sign
# every *.exe and *.msi in the uploaded artifact (SHA256, with a timestamp).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the linked version
        run: bash packaging/publish/check-tag.sh

      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # libdbus-1-dev: keyring reaches the Secret Service through libdbus.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Export Apple signing credentials
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash packaging/publish/export-apple-credentials.sh

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LiteDB v__VERSION__
          releaseBody: |
            Installers for this version are attached to this tag. The README download badge and the changelog use the same tag.

            The installers are not code-signed yet. On Windows, SmartScreen may warn: choose More info, then Run anyway. On macOS, if LiteDB is called damaged, run `xattr -cr /Applications/LiteDB.app` once and open it again.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the linked version
        shell: bash
        run: bash packaging/publish/check-tag.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # The updater key is required. SignPath is all or nothing: both secrets
      # sign the installers, neither builds them unsigned with a warning.
      - name: Check signing secrets
        id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "authenticode=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$SIGNPATH_API_TOKEN$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "::warning::No SignPath secrets: the Windows installers are not Authenticode-signed, and SmartScreen will warn on them."
            echo "authenticode=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set both SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID, or neither."
            exit 1
          fi

      - name: Build installer
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-bundle | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe windows-bundle/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi windows-bundle/
          if (-not (Get-ChildItem windows-bundle -Filter *-setup.exe)) {
            throw 'NSIS installer was not built'
          }

      - name: Upload unsigned installers
        id: unsigned
        if: steps.signing.outputs.authenticode == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: windows-bundle/
          if-no-files-found: error

      - name: Authenticode sign
        if: steps.signing.outputs.authenticode == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'litedb' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: ${{ runner.temp }}/installers

      # Authenticode changes the file, so the minisign signature from the
      # build no longer matches. Sign the Authenticode-signed installer.
      - name: Sign the updater artifact
        if: steps.signing.outputs.authenticode == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exes = Get-ChildItem -Path "$env:RUNNER_TEMP/installers" -Recurse -Filter '*-setup.exe'
          if ($exes.Count -lt 1) {
            throw 'SignPath returned no NSIS installer. The artifact configuration must sign *.exe and *.msi.'
          }
          foreach ($exe in $exes) {
            npx tauri signer sign "$($exe.FullName)"
          }

      # Unsigned, the installers and the build's own updater signature are the
      # files to publish: nothing changed them after the signature was made.
      - name: Keep the unsigned installers
        if: steps.signing.outputs.authenticode != 'true'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'installers'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item windows-bundle/* $out/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig $out/
          if (-not (Get-ChildItem $out -Filter *-setup.exe.sig)) {
            throw 'The build made no updater signature for the NSIS installer'
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: ${{ runner.temp }}/installers
          if-no-files-found: error

  publish-windows:
    name: Attach Windows installers
    needs: [publish, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers

      - name: Upload and point the updater at the signed installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash packaging/publish/upload-windows.sh
