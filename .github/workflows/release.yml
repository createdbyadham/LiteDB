name: Publish Release

# Pushing v2.4.0 publishes the GitHub release on that same tag.
# The README badge and the changelog link to releases/tag/v<version>.
# Do not set tagName to app-v__VERSION__; that creates a second tag with the
# installers and leaves the linked tag empty.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE                  base64 .p12 of the Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY             Developer ID Application: Name (TEAMID)
#   Notarization, either:
#     APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#     or APPLE_API_KEY (Key ID), APPLE_API_ISSUER, APPLE_API_PRIVATE_KEY (.p8 contents)
#   SIGNPATH_API_TOKEN
#   SIGNPATH_ORGANIZATION_ID
# Variables (optional):
#   SIGNPATH_PROJECT_SLUG              default litedb
#   SIGNPATH_SIGNING_POLICY            default release-signing (SignPath Foundation)
# The SignPath project's default artifact configuration must Authenticode-sign
# every *.exe and *.msi in the uploaded artifact (SHA256, with a timestamp).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the linked version
        run: bash packaging/publish/check-tag.sh

      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Export Apple signing credentials
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash packaging/publish/export-apple-credentials.sh

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LiteDB v__VERSION__
          releaseBody: |
            ## Code signing policy

            Free code signing provided by SignPath.io, certificate by SignPath Foundation

            Installers for this version are attached to this tag. The README download badge and the changelog use the same tag.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the linked version
        shell: bash
        run: bash packaging/publish/check-tag.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Require signing secrets
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing ${missing[*]}. An unsigned Windows installer is what SmartScreen warns on."
            exit 1
          fi

      - name: Build installer
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-bundle | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe windows-bundle/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi windows-bundle/
          if (-not (Get-ChildItem windows-bundle -Filter *-setup.exe)) {
            throw 'NSIS installer was not built'
          }

      - name: Upload unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: windows-bundle/
          if-no-files-found: error

      - name: Authenticode sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'litedb' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: ${{ runner.temp }}/signed

      # Authenticode changes the file, so the minisign signature from the
      # build no longer matches. Sign the Authenticode-signed installer.
      - name: Sign the updater artifact
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exes = Get-ChildItem -Path "$env:RUNNER_TEMP/signed" -Recurse -Filter '*-setup.exe'
          if ($exes.Count -lt 1) {
            throw 'SignPath returned no NSIS installer. The artifact configuration must sign *.exe and *.msi.'
          }
          foreach ($exe in $exes) {
            npx tauri signer sign "$($exe.FullName)"
          }

      - name: Upload signed installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: ${{ runner.temp }}/signed
          if-no-files-found: error

  publish-windows:
    name: Attach signed Windows installers
    needs: [publish, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: signed

      - name: Upload and point the updater at the signed installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash packaging/publish/upload-windows.sh
